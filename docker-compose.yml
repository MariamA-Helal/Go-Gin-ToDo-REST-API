
services:
  # 1. PostgreSQL
  db:
    image: postgres:15-alpine
    env_file:
      - .env 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Go API
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env 

volumes:
  postgres_data: